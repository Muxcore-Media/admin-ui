name: CI
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: core
          repository: Muxcore-Media/core
          token: ${{ secrets.MUXCORE_CI_TOKEN }}
      - uses: actions/checkout@v7
        with:
          path: contracts-media-admin
          repository: Muxcore-Media/contracts-media-admin
          token: ${{ secrets.MUXCORE_CI_TOKEN }}
      - uses: actions/checkout@v7
        with:
          path: media-custom-formats
          repository: Muxcore-Media/media-custom-formats
          token: ${{ secrets.MUXCORE_CI_TOKEN }}
      - uses: actions/checkout@v7
        with:
          path: media-rename
          repository: Muxcore-Media/media-rename
          token: ${{ secrets.MUXCORE_CI_TOKEN }}
      - uses: actions/checkout@v7
        with:
          path: media-root-folders
          repository: Muxcore-Media/media-root-folders
          token: ${{ secrets.MUXCORE_CI_TOKEN }}
      - uses: actions/checkout@v7
        with:
          path: admin-ui
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - working-directory: ./admin-ui
        run: go vet ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: core
          repository: Muxcore-Media/core
          token: ${{ secrets.MUXCORE_CI_TOKEN }}
      - uses: actions/checkout@v7
        with:
          path: contracts-media-admin
          repository: Muxcore-Media/contracts-media-admin
          token: ${{ secrets.MUXCORE_CI_TOKEN }}
      - uses: actions/checkout@v7
        with:
          path: media-custom-formats
          repository: Muxcore-Media/media-custom-formats
          token: ${{ secrets.MUXCORE_CI_TOKEN }}
      - uses: actions/checkout@v7
        with:
          path: media-rename
          repository: Muxcore-Media/media-rename
          token: ${{ secrets.MUXCORE_CI_TOKEN }}
      - uses: actions/checkout@v7
        with:
          path: media-root-folders
          repository: Muxcore-Media/media-root-folders
          token: ${{ secrets.MUXCORE_CI_TOKEN }}
      - uses: actions/checkout@v7
        with:
          path: admin-ui
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - working-directory: ./admin-ui
        run: go test -race -count=1 -timeout 10m ./...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: core
          repository: Muxcore-Media/core
          token: ${{ secrets.MUXCORE_CI_TOKEN }}
      - uses: actions/checkout@v7
        with:
          path: contracts-media-admin
          repository: Muxcore-Media/contracts-media-admin
          token: ${{ secrets.MUXCORE_CI_TOKEN }}
      - uses: actions/checkout@v7
        with:
          path: media-custom-formats
          repository: Muxcore-Media/media-custom-formats
          token: ${{ secrets.MUXCORE_CI_TOKEN }}
      - uses: actions/checkout@v7
        with:
          path: media-rename
          repository: Muxcore-Media/media-rename
          token: ${{ secrets.MUXCORE_CI_TOKEN }}
      - uses: actions/checkout@v7
        with:
          path: media-root-folders
          repository: Muxcore-Media/media-root-folders
          token: ${{ secrets.MUXCORE_CI_TOKEN }}
      - uses: actions/checkout@v7
        with:
          path: admin-ui
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - working-directory: ./admin-ui
        run: |
          go build -o /dev/null ./...
          go vet ./...

  docker:
    if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    steps:
      - uses: actions/checkout@v7
        with:
          path: core
          repository: Muxcore-Media/core
          token: ${{ secrets.MUXCORE_CI_TOKEN }}
      - uses: actions/checkout@v7
        with:
          path: contracts-media-admin
          repository: Muxcore-Media/contracts-media-admin
          token: ${{ secrets.MUXCORE_CI_TOKEN }}
      - uses: actions/checkout@v7
        with:
          path: media-custom-formats
          repository: Muxcore-Media/media-custom-formats
          token: ${{ secrets.MUXCORE_CI_TOKEN }}
      - uses: actions/checkout@v7
        with:
          path: media-rename
          repository: Muxcore-Media/media-rename
          token: ${{ secrets.MUXCORE_CI_TOKEN }}
      - uses: actions/checkout@v7
        with:
          path: media-root-folders
          repository: Muxcore-Media/media-root-folders
          token: ${{ secrets.MUXCORE_CI_TOKEN }}
      - uses: actions/checkout@v7
        with:
          path: admin-ui
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./admin-ui/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}:${{ github.sha }}
