name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=120s ./...

  css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build CSS
        run: |
          curl -sL "https://github.com/tailwindlabs/tailwindcss/releases/download/v4.1.6/tailwindcss-linux-x64" -o tailwindcss
          chmod +x tailwindcss
          ./tailwindcss -i input.css -o assets/dist/styles.css --minify

  build:
    runs-on: ubuntu-latest
    needs: [lint, css]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - name: Build CSS
        run: |
          curl -sL "https://github.com/tailwindlabs/tailwindcss/releases/download/v4.1.6/tailwindcss-linux-x64" -o tailwindcss
          chmod +x tailwindcss
          ./tailwindcss -i input.css -o assets/dist/styles.css --minify
      - name: Generate Templ
        run: go install github.com/a-h/templ/cmd/templ@latest && templ generate
      - name: Build
        run: go build -ldflags="-s -w" -o admin-ui .

  test:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - name: Build CSS
        run: |
          curl -sL "https://github.com/tailwindlabs/tailwindcss/releases/download/v4.1.6/tailwindcss-linux-x64" -o tailwindcss
          chmod +x tailwindcss
          ./tailwindcss -i input.css -o assets/dist/styles.css --minify
      - name: Generate Templ
        run: go install github.com/a-h/templ/cmd/templ@latest && templ generate
      - name: Test
        run: go test -race -count=1 -timeout 120s ./...

  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - name: Vet
        run: go vet ./...
